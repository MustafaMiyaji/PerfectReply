<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PerfectReply</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FF6B6B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z'/%3E%3C/svg%3E" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              serif: ['Fraunces', 'serif'],
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              'soft-blush': '#FFD1DC',
              'deep-lavender': '#E6E6FA',
              'dark-slate': '#2D2D2D',
              'heartbeat-red': '#FF6B6B',
              'glass-border': 'rgba(255, 255, 255, 0.2)',
              'glass-surface': 'rgba(255, 255, 255, 0.65)',
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'blob': 'blob 10s infinite',
              'gradient-x': 'gradient 6s ease infinite',
              'shimmer': 'shimmer 2.5s linear infinite',
              'scan': 'scan 2s linear infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              gradient: {
                '0%, 100%': { 'background-position': '0% 50%' },
                '50%': { 'background-position': '100% 50%' },
              },
              shimmer: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(100%)' }
              },
              scan: {
                '0%': { top: '0%' },
                '50%': { top: '100%' },
                '100%': { top: '0%' }
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        margin: 0;
        background-color: #F2F2F7; /* iOS Light Gray */
        color: #1c1c1e;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent; /* Remove iOS tap gray box */
        transition: background-color 0.5s ease, color 0.5s ease;
      }
      .dark body {
        background-color: #000000; /* iOS Dark */
        color: #f5f5f7;
      }
      
      /* Liquid Glass Effect (Premium) */
      .glass-panel {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 
          0 4px 6px -1px rgba(0, 0, 0, 0.02), 
          0 12px 30px -5px rgba(0, 0, 0, 0.05),
          inset 0 0 0 1px rgba(255,255,255,0.3);
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      }
      
      .dark .glass-panel {
        background: rgba(30, 30, 30, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 
          0 8px 32px 0 rgba(0, 0, 0, 0.5),
          inset 0 0 0 1px rgba(255,255,255,0.05);
      }

      /* Ultra Premium Hover State for Glass */
      .glass-panel-hover:hover {
        background: rgba(255, 255, 255, 0.75);
        transform: translateY(-2px) scale(1.005);
        box-shadow: 
          0 20px 40px -5px rgba(0, 0, 0, 0.1),
          inset 0 0 0 1px rgba(255,255,255,0.6);
      }
      .dark .glass-panel-hover:hover {
        background: rgba(40, 40, 40, 0.7);
        box-shadow: 
          0 20px 40px -5px rgba(0, 0, 0, 0.6),
          inset 0 0 0 1px rgba(255,255,255,0.15);
      }
      
      /* Selection Color */
      ::selection {
        background: rgba(99, 102, 241, 0.2);
        color: #4F46E5;
      }
      .dark ::selection {
        background: rgba(99, 102, 241, 0.4);
        color: #E0E7FF;
      }
      
      /* iOS-style Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.1);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.2);
      }
      .dark ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.25);
      }
      
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Perspective container for 3D tilts */
      .perspective-1000 {
        perspective: 1000px;
      }
      
      /* Smooth color transitions */
      *, *::before, *::after {
        transition-property: background-color, border-color, color, fill, stroke, opacity, box-shadow, transform, backdrop-filter;
        transition-duration: 300ms;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>

{

  }
}
</script>
